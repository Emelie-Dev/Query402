name: CI / quality
on: [pull_request, push]

jobs:
  quality:
    runs-on: ubuntu-latest
    # Bound total job runtime so a hung install, lint, or test step fails fast (<= 20 min)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test
